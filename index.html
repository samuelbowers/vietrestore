<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vietnam restoration opportunity explorer</title>
<meta name="description" content="Explore Vietnam with an interactive satellite map. Restoration opportunity layers will be added as the project develops.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231b493c'/%3E%3Cpath d='M8 23C6 10 15 7 25 7c0 12-6 19-14 15L23 9' fill='%23c3dfad' stroke='%231b493c'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
<style>
:root{font-family:Arial,Helvetica,sans-serif;color:#233d34;background:#f4f5ef;font-synthesis:none}*{box-sizing:border-box}body{margin:0}header{height:90px;background:#fff;border-bottom:1px solid #dce3d9;display:flex;align-items:center;justify-content:space-between;padding:0 36px}.brand{display:flex;gap:13px;align-items:center}.mark{height:43px;width:43px;background:#214e40;border-radius:12px;display:grid;place-items:center;color:#d6e9b4;font-size:29px}.brand h1{font-size:24px;letter-spacing:-1px;margin:0 0 5px}.brand p{font-size:12px;margin:0;color:#65776d}.pill{font-size:11px;letter-spacing:1px;text-transform:uppercase;padding:10px 13px;border:1px solid #d5dfd2;border-radius:30px;white-space:nowrap}.pill:before{content:'';display:inline-block;width:6px;height:6px;border-radius:50%;background:#b68740;margin-right:8px}
body{height:100vh;height:100dvh;display:flex;flex-direction:column;overflow:hidden}header{flex-shrink:0}main{flex:1;min-height:0;position:relative}#map{width:100%;height:100%;background:#203b36}.map-status{position:absolute;z-index:1000;top:16px;left:60px;right:16px;width:fit-content;max-width:calc(100% - 76px);padding:12px 16px;background:#fff;border-radius:8px;font-size:12px;box-shadow:0 2px 12px #0002}.map-status[hidden]{display:none}.leaflet-control-attribution{font-size:10px}.leaflet-container{font-family:Arial,Helvetica,sans-serif}.leaflet-bar a{color:#214e40}.leaflet-container:focus-visible{outline:3px solid #b6d997;outline-offset:-3px}@media(max-width:700px){header{height:auto;min-height:88px;padding:18px;gap:12px}.brand h1{font-size:22px}.brand p{max-width:185px;font-size:10px}.pill{font-size:8px;padding:8px}}
.forest-status{top:62px}.forest-tooltip{white-space:normal;max-width:min(300px,70vw);font-size:12px;line-height:1.5;padding:9px 12px;color:#233d34;border-radius:6px}.leaflet-control-layers{border:1px solid #d5dfd2!important;border-radius:8px!important;color:#233d34}.leaflet-control-layers label{padding:5px}
.landcover-image{image-rendering:pixelated}.comparison-status{top:110px}.leaflet-control-layers{max-width:260px}.leaflet-control-layers label{font-size:12px}
.brand h1{margin:0;letter-spacing:-.6px;line-height:1.2}.classification-legend{background:#fffffff2;border:1px solid #d5dfd2;border-radius:8px;padding:13px 15px;color:#233d34;font-size:12px;box-shadow:0 2px 10px #0001;max-width:260px}.classification-legend strong{display:block;font-size:12px;margin-bottom:10px}.classification-legend div{display:flex;align-items:center;gap:9px;margin-top:7px}.legend-swatch{width:15px;height:15px;border-radius:3px;border:1px solid #0002;flex:none}.leaflet-pane canvas.leaflet-interactive{cursor:grab}.leaflet-dragging .leaflet-pane canvas{cursor:grabbing}@media(max-width:700px){.brand h1{font-size:18px;max-width:250px}.pill{white-space:normal;text-align:center}}
.classification-obscured canvas{pointer-events:none!important}
</style></head><body>
<header><div class="brand"><div><h1>Vietnam restoration opportunity explorer</h1></div></div><span class="pill">In development</span></header>
<main aria-label="Satellite map of Vietnam"><div id="map" tabindex="0" aria-label="Interactive satellite map. Use arrow keys to pan and plus or minus to zoom."></div><div id="map-status" class="map-status" role="status">Loading satellite imagery…</div><noscript><div class="map-status">Enable JavaScript to view the interactive map.</div></noscript></main>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script src="https://unpkg.com/esri-leaflet@3.0.15/dist/esri-leaflet.js" crossorigin=""></script>
<script src="https://unpkg.com/leaflet.vectorgrid@1.3.0/dist/Leaflet.VectorGrid.bundled.js"></script>
<script src="forest.js"></script>
<script src="comparison.js"></script>
<script>
(function () {
  const status = document.getElementById('map-status');
  if (!window.L || !L.esri) {
    status.textContent = 'The map could not load. Check your connection and refresh the page.';
    return;
  }
  const map = L.map('map', {minZoom: 2, maxZoom: 19, zoomSnap: 1});
  map.fitBounds([[8.2, 102.1], [23.5, 109.6]], {padding: [24, 24]});
  // Esri Leaflet manages imagery-provider attribution as the view changes.
  const imagery = L.esri.basemapLayer('Imagery', {maxZoom: 19});
  let failed = false;
  imagery.on('loading', function () { failed = false; });
  imagery.on('tileerror', function () {
    failed = true;
    status.hidden = false;
    status.textContent = 'Some imagery could not load. Try another zoom level or refresh the page.';
  });
  imagery.on('load', function () { if (!failed) status.hidden = true; });
  imagery.addTo(map);
  map.createPane('nationalForest');
  map.getPane('nationalForest').style.zIndex = 410;
  const controls = L.control.layers(null, {}, {collapsed: false, position: 'topright'}).addTo(map);
  addForestLayer(map, controls);
  addComparisonLayers(map, controls);
  L.control.scale({imperial: false, position: 'bottomleft'}).addTo(map);
  new ResizeObserver(function () { map.invalidateSize(); }).observe(document.getElementById('map'));
})();
</script></body></html>
